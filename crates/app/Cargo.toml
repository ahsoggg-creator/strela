[package]
name = "strela-app"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ahsoggg-creator/strela"

[[bin]]
name = "Strela"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strela-core = { version = "0.2.0", path = "../core" }
ureq = "3.4.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_Services"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3.27.0"
