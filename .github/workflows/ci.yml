name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The runner is an elevated administrator on a real NTFS volume: the only place where the MFT / USN path and the
  # Windows service are exercised for real (they need administrator rights; the unit tests use synthetic records).
  integration:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: MFT scan of C:\ (read-only)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = .\target\release\strela-cli.exe index --root C:\ --mft --index "$env:RUNNER_TEMP\mft.bin"
          $out
          if (-not ($out -match 'MFT\+USN')) { throw 'the MFT backend was not used' }
          $r = .\target\release\strela-cli.exe search "notepad.exe" --root C:\ --mft --index "$env:RUNNER_TEMP\mft.bin" --time 2>&1
          $r
          if (-not ($r -match 'System32\\notepad\.exe')) { throw 'System32\notepad.exe not found through the MFT index' }
      - name: Indexer service install, query, uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = ".\target\release\Strela.exe"
          $p = Start-Process $exe -ArgumentList '--install-service' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "service install failed: $($p.ExitCode)" }
          sc.exe query StrelaIndexer
          Start-Sleep 20
          $r = .\target\release\strela-cli.exe search "notepad.exe" --service --time 2>&1
          $r
          if (-not ($r -match 'notepad\.exe')) { throw 'service did not answer' }
          $p = Start-Process $exe -ArgumentList '--uninstall-service' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "service uninstall failed: $($p.ExitCode)" }
          sc.exe query StrelaIndexer
          if (Test-Path "$env:ProgramFiles\Strela") { Get-ChildItem "$env:ProgramFiles\Strela" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200; throw 'Program Files\Strela was left behind' }
          # sc.exe returns 1060 for a service that is (rightly) gone; do not let that become the step's exit code
          exit 0
      # The USN journal followed live: create / rename / delete a file and watch the service-style indexer notice each.
      - name: USN journal, live changes (scripts/admin-check.ps1)
        if: always()
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'admin-check.log'
          .\scripts\admin-check.ps1 -Roots 'C:\','D:\' -Log $log
          Get-Content $log
          $t = Get-Content $log -Raw
          if ($t -notmatch 'USN создание') { throw 'USN check did not run' }
          if ($t -match '-1[.,]00 с' -or $t -match 'ТАЙМАУТ' -or $t -match 'ОШИБКА') { throw 'USN check failed' }
          exit 0
      # Block cloning needs ReFS / Dev Drive. If the runner can make a ReFS volume, check the clone path for real;
      # if it cannot, this step is allowed to fail and the feature stays "implemented, not verified".
      - name: Block cloning on a ReFS volume
        if: always()
        timeout-minutes: 10
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $vhd = Join-Path $env:RUNNER_TEMP 'refs.vhdx'
          $script = @(
            "create vdisk file=`"$vhd`" maximum=4096 type=expandable",
            'attach vdisk',
            'create partition primary',
            'format fs=refs quick label=StrelaReFS',
            'assign letter=R'
          )
          $dp = Join-Path $env:RUNNER_TEMP 'dp.txt'
          Set-Content $dp $script -Encoding ascii
          diskpart /s $dp
          fsutil fsinfo volumeinfo R:\
          .\target\release\strela-cli.exe bench gen-big R:\src\big.bin --mb 512
          $out = .\target\release\strela-cli.exe copy R:\src\big.bin R:\dst
          $out
          if (-not ($out -match 'клонирование блоков')) { throw 'block cloning was not used' }
          $a = (Get-Item R:\src\big.bin).Length; $b = (Get-Item R:\dst\big.bin).Length
          if ($a -ne $b) { throw "sizes differ: $a vs $b" }
